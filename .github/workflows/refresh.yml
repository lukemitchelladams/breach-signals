name: refresh breach signals
on:
  schedule:
    - cron: "15 11 * * *"   # daily 11:15 UTC (07:15 ET)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [breach_feed.py]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pypdf
      - name: pull sources
        env:
          RWL_PRO_KEY: ${{ secrets.RWL_PRO_KEY }}
        run: python breach_feed.py --days 30 --json docs/signals.json --out docs/signals.csv
      - name: commit
        run: |
          git config user.name "breach-signals bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/signals.json docs/signals.csv domains.json letters.json
          git diff --cached --quiet || git commit -m "refresh $(date -u +%F)"
          git push
